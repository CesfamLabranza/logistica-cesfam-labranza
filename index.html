<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logística CESFAM Labranza</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">

    <div id="landing" class="landing">
      <img src="assets/logo-cesfam.png" alt="CESFAM Labranza" class="logo" />
      <h1 class="landing-title">CESFAM Labranza</h1>
      <p class="landing-sub">Sistema de Logística e Inventario</p>
      <button id="btnIngresar" class="btn-ingresar">Ingresar al sistema</button>
    </div>

    <div id="app" class="hidden">
    <header class="topbar">
      <div>
        <h1>Logística e inventario</h1>
        <p>Seleccione un box, oficina o dependencia para revisar su inventario asociado.</p>
      </div>
    </header>

    <main class="panel">
  <div class="map-wrapper">

    <img src="assets/plano-cesfam.png"
         alt="Plano CESFAM Labranza"
         class="map-img" />

    <button class="zone z-bodega-almacenamiento" data-id="bodega_almacenamiento">Bodega almacenamiento</button>
    <button class="zone z-sala-conductores" data-id="sala_conductores">Sala conductores</button>
    <button class="zone z-bodega-mantenimiento" data-id="bodega_mantenimiento">Bodega mantenimiento</button>

    <button class="zone z-ira" data-id="ira">IRA</button>
    <button class="zone z-endoscopia" data-id="endoscopia">Endoscopía</button>
    <button class="zone z-rayos-x" data-id="rayos_x">Rayos X</button>
    <button class="zone z-era" data-id="era">ERA</button>

    <button class="zone z-farmacia" data-id="farmacia">Farmacia</button>
    <button class="zone z-bodega-farmacia" data-id="bodega_farmacia">Bodega farmacia</button>
    <button class="zone z-oficina-quimico" data-id="oficina_quimico">Of. Químico</button>
    <button class="zone z-esterilizacion" data-id="esterilizacion">Esterilización</button>

    <button class="zone z-some" data-id="some">SOME</button>
    <button class="zone z-oirs" data-id="oirs">OIRS</button>
    <button class="zone z-toma-muestras" data-id="toma_muestras">Toma muestras</button>
    <button class="zone z-vacunatorio" data-id="vacunatorio">Vacunatorio</button>

    <button class="zone z-casino" data-id="casino_comedor">Casino comedor</button>
    <button class="zone z-padi" data-id="padi">PADI</button>
    <button class="zone z-signos-vitales" data-id="signos_vitales">Signos vitales</button>
    <button class="zone z-entrega-leche" data-id="entrega_leche">Entrega leche</button>

    <button class="zone z-direccion" data-id="direccion">Dirección</button>
    <button class="zone z-informatica" data-id="informatica">Informática</button>
    <button class="zone z-gestion-oficina" data-id="gestion_oficina">Gestión oficina</button>
    <button class="zone z-secretaria" data-id="secretaria">Secretaría</button>

  </div>
</main>
  </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">×</button>
      <h2 id="modalTitle">Dependencia</h2>
      <p id="modalResponsible"></p>

      <div id="inventoryContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
